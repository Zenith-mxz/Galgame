<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>柑橘调的夏日 · 视觉小说</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="app">
  <div id="viewport">
    <div id="bg-layer"><div class="bg-img" id="bg-a"></div><div class="bg-img" id="bg-b"></div></div>
    <div id="weather"></div>
    <div id="sprite-layer">
      <div class="sprite" id="sprite-left"></div>
      <div class="sprite" id="sprite-center"></div>
      <div class="sprite" id="sprite-right"></div>
    </div>
    <div id="flash"></div>

    <div id="title-screen" class="screen">
      <div class="title-bg"></div>
      <div class="title-content">
        <p class="title-sub">S U M M E R &nbsp;C I T R U S</p>
        <h1 class="title-main">柑橘调的夏日</h1>
        <p class="title-tag">三年后回到海边小镇，那些没说完的话，还在等你。</p>
        <div class="title-menu">
          <button class="menu-btn primary" data-action="new-game">开始游戏</button>
          <button class="menu-btn" data-action="continue">继续游戏</button>
          <button class="menu-btn" data-action="load">读取存档</button>
          <button class="menu-btn" data-action="gallery">结局图鉴</button>
          <button class="menu-btn" data-action="config">设置</button>
        </div>
        <p class="title-foot">已解锁结局 <span id="title-endcount">0 / 9</span></p>
      </div>
      <div class="title-sprites">
        <div class="title-sprite" data-theme="kasumi"></div>
        <div class="title-sprite" data-theme="yuina"></div>
        <div class="title-sprite" data-theme="sion"></div>
      </div>
    </div>

    <div id="game-screen" class="screen hidden">
      <div id="choice-layer" class="hidden"></div>

      <div id="textbox" class="hidden">
        <div id="namebox"></div>
        <div id="text-body">
          <span id="text-content"></span><span id="next-indicator">▼</span>
        </div>
      </div>

      <div id="top-bar">
        <div id="chapter-tag"></div>
        <div id="quick-buttons">
          <button class="qb" data-action="backlog" title="回看">回看</button>
          <button class="qb" data-action="auto" title="自动播放">自动</button>
          <button class="qb" data-action="skip" title="跳过已读">跳过</button>
          <button class="qb" data-action="quick-save" title="快速存档">快存</button>
          <button class="qb" data-action="quick-load" title="快速读档">快读</button>
          <button class="qb" data-action="save" title="存档">存档</button>
          <button class="qb" data-action="load" title="读档">读档</button>
          <button class="qb" data-action="config" title="设置">设置</button>
          <button class="qb" data-action="menu" title="返回标题">标题</button>
        </div>
      </div>

      <div id="auto-badge" class="badge hidden">自动播放中</div>
      <div id="skip-badge" class="badge hidden">跳过已读中</div>
    </div>

    <div id="ending-screen" class="screen hidden">
      <div class="ending-cg" id="ending-cg"></div>
      <div class="ending-panel">
        <p class="ending-label" id="ending-label">ENDING</p>
        <h2 class="ending-title" id="ending-title"></h2>
        <p class="ending-text" id="ending-text"></p>
        <div class="ending-actions">
          <button class="menu-btn primary" data-action="ending-back">返回标题</button>
          <button class="menu-btn" data-action="ending-gallery">查看图鉴</button>
        </div>
      </div>
    </div>

    <div id="modal-layer" class="hidden">
      <div class="modal" id="modal">
        <div class="modal-head">
          <h3 id="modal-title">标题</h3>
          <button class="modal-close" data-action="modal-close">×</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
      </div>
    </div>

    <div id="toast"></div>
  </div>
</div>
<script src="../js/art.js"></script>
<script src="../js/backgrounds.js"></script>
<script src="../js/story.js"></script>
<script src="../js/app.js"></script>
<script>
window.addEventListener('load', function () {
  setTimeout(function () {
    Game.newGame();
    var n = 0;
    var t = setInterval(function () {
      var c = document.getElementById('choice-layer');
      if (c && !c.classList.contains('hidden')) {
        var o = c.querySelectorAll('button');
        if (o.length) o[0].click();
        return;
      }
      var b = document.getElementById('textbox');
      if (b && !b.classList.contains('hidden')) b.click();
      n++;
      if (n > 12) clearInterval(t);
    }, 280);
  }, 400);
});
</script></body>
</html>
