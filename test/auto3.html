<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:1600px;height:900px;display:block}</style></head>
<body>
<iframe id="f" src="../index.html"></iframe>
<script>
var f = document.getElementById('f');
var tries = 0;
var bootTimer = setInterval(function () {
  tries++;
  var w, d;
  try { w = f.contentWindow; d = f.contentDocument; } catch (e) { return; }
  if (!w || !w.Game || !d) { if (tries > 40) clearInterval(bootTimer); return; }
  clearInterval(bootTimer);
  w.Game.newGame();
  var n = 0;
  var timer = setInterval(function () {
    var choice = d.getElementById('choice-layer');
    if (choice && !choice.classList.contains('hidden')) {
      var opts = choice.querySelectorAll('button');
      if (opts.length) { opts[0].click(); }
      return;
    }
    var box = d.getElementById('textbox');
    if (box && !box.classList.contains('hidden')) box.click();
    n++;
    if (n > 10) clearInterval(timer);
  }, 280);
}, 150);
</script>
</body></html>
