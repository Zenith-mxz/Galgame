<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:1600px;height:900px;display:block}</style></head>
<body>
<iframe id="f" src="../index.html"></iframe>
<div id="diag" style="position:fixed;left:0;top:0;color:#0f0;font:12px monospace;background:#000a;padding:6px;white-space:pre;z-index:99"></div>
<script>
var f = document.getElementById('f');
var log = [];
function L(m){ log.push(m); document.getElementById('diag').textContent = log.join('\n'); }
f.addEventListener('load', function () {
  setTimeout(function () {
    var d = f.contentDocument;
    L('title hidden? ' + d.getElementById('title-screen').classList.contains('hidden'));
    var b = d.querySelector('[data-action="new-game"]');
    L('new-game btn: ' + !!b);
    if (b) b.click();
    setTimeout(function () {
      L('after click title hidden? ' + d.getElementById('title-screen').classList.contains('hidden'));
      L('game hidden? ' + d.getElementById('game-screen').classList.contains('hidden'));
      L('textbox hidden? ' + d.getElementById('textbox').classList.contains('hidden'));
      L('name=' + d.getElementById('namebox').textContent);
      L('text=' + (d.getElementById('text-content')||{}).textContent);
      L('bg-a style=' + d.getElementById('bg-a').style.background.slice(0,60));
      var sp = d.getElementById('sprite-center');
      L('sprite-center svg? ' + (sp.querySelector('svg') ? 'YES':'NO'));
      L('sprite-center cls=' + sp.className);
    }, 1600);
  }, 900);
});
</script>
</body></html>
